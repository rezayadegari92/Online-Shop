services:
  db:
    container_name: onlineshop_db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlineshop}
      POSTGRES_USER: ${POSTGRES_USER:-onlineshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onlineshop}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onlineshop} -d ${POSTGRES_DB:-onlineshop}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    container_name: onlineshop_redis
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    container_name: onlineshop_web
    build: .
    image: onlineshop:latest
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlineshop}
      POSTGRES_USER: ${POSTGRES_USER:-onlineshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onlineshop}
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: core.settings
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    container_name: onlineshop_celery
    image: onlineshop:latest
    working_dir: /app
    command: celery -A core.celery_config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlineshop}
      POSTGRES_USER: ${POSTGRES_USER:-onlineshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onlineshop}
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: core.settings
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    container_name: onlineshop_celery_beat
    image: onlineshop:latest
    working_dir: /app
    command: celery -A core.celery_config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlineshop}
      POSTGRES_USER: ${POSTGRES_USER:-onlineshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onlineshop}
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: core.settings
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  frontend:
    container_name: onlineshop_frontend
    build: ../frontend
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://web:8000}
    depends_on:
      - web
    restart: unless-stopped

  prometheus:
    container_name: onlineshop_prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - web
      - db
      - redis
    restart: unless-stopped

  grafana:
    container_name: onlineshop_grafana
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres-exporter:
    container_name: onlineshop_postgres_exporter
    image: prometheuscommunity/postgres-exporter:latest
    env_file:
      - .env
      - .env.example
    restart: unless-stopped

  redis-exporter:
    container_name: onlineshop_redis_exporter
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  media_volume:
  postgres_data:
  prometheus_data:
  grafana_data:
